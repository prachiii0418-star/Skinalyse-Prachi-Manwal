<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Skinalyse </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="top-bar">
        <div class="logo">
            <!-- LOGO IMAGE GOES HERE -->
            <img src="logo.img.jpeg" alt="Skinalyse Logo">
            <span> Skinalyse </span>
        </div>

        <div class="lang">
            Lang: En
        </div>
    </header>

    <!-- Main Section -->
    <main class="container">
        <h1>Check your skin!</h1>

        <!-- Steps Section -->
        <section class="steps">

            <!-- Step 1 -->
            <div class="step">
                <!-- STEP 1 IMAGE GOES HERE -->
                <img src="step1hand.img" alt="Take photo">
                <h3>Step 1</h3>
                <p>Take a photo of a skin concern</p>
            </div>

            <!-- Step 2 -->
            <div class="step">
                <!-- STEP 2 IMAGE GOES HERE -->
                <img src="step2AI.jpeg" alt="AI analysis">
                <h3>Step 2</h3>
                <p>AI instantly analyzes your photo</p>
            </div>

            <!-- Step 3 -->
            <div class="step">
                <!-- STEP 3 IMAGE GOES HERE -->
                <img src="step3report.webp" alt="PDF report">
                <h3>Step 3</h3>
                <p>Get a personalized PDF report</p>
            </div>

            <!-- Step 4 -->
            <div class="step">
                <!-- STEP 4 IMAGE GOES HERE -->
                <img src="step4cuterobot.jpeg" alt="AI consultant">
                <h3>Step 4</h3>
                <p>The AI consultant explains your result</p>
            </div>

        </section>

        <!-- Call to Action -->
        <button class="cta">
            GET INSTANT RESULT
        </button>
    </main>

</body>
</html>
